# Machine: what the car does.  Triggers and states, nothing else - no
# endpoints, no starting state, nothing about where this is deployed.
#
#   power_off --ignition_on--> self_test --passed--> standing
#   standing  --throttle_pressed--> accelerating --throttle_released--> coasting
#   coasting  --brake_pressed--> braking --vehicle_stopped--> standing
#
# Anything the current state does not list is rejected and reported.  There are
# no guards, no actions and no parameters.
#
# No 'channel' is given for any trigger, so each one listens on its own name -
# which is exactly what you type into the console example.  A networked port
# would add e.g. `channel: "car/brakes/pressed"` to each trigger.

fsm:
  name: car          # the definition, not the instance - that is in the setup

triggers:
  # ignition switch
  - {name: ignition_on}
  - {name: ignition_off}
  # self test unit
  - {name: self_test_passed}
  - {name: self_test_failed}
  # engine
  - {name: throttle_pressed}
  - {name: throttle_released}
  - {name: engine_fault}
  # brake system
  - {name: brake_pressed}
  - {name: brake_released}
  # wheel speed sensors
  - {name: vehicle_stopped}

states:
  - name: power_off
    transitions:
      ignition_on: self_test

  - name: self_test
    transitions:
      self_test_passed: standing
      self_test_failed: fault
      ignition_off:     power_off

  - name: standing
    transitions:
      throttle_pressed: accelerating
      brake_pressed:    standing      # holding the brake while parked changes nothing
      engine_fault:     fault
      ignition_off:     power_off

  - name: accelerating
    transitions:
      throttle_released: coasting
      brake_pressed:     braking
      engine_fault:      fault

  - name: coasting
    transitions:
      throttle_pressed: accelerating
      brake_pressed:    braking
      vehicle_stopped:  standing
      engine_fault:     fault

  - name: braking
    transitions:
      vehicle_stopped: standing
      brake_released:  coasting
      engine_fault:    fault

  - name: fault
    transitions:
      ignition_off: power_off
