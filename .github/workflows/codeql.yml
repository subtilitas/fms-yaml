# SPDX-License-Identifier: MIT
#
# CodeQL.
#
# Code scanning is free on a public repository, which this one is, so this runs
# on every push and pull request as well as weekly.
#
# IF THIS REPOSITORY IS EVER MADE PRIVATE AGAIN: code scanning then requires
# GitHub Advanced Security, a paid add-on, and without it the upload step fails
# with "Advanced Security must be enabled for this repository to use code
# scanning".  Put the job's `if:` guard back -
#
#     if: ${{ github.event_name == 'workflow_dispatch' }}
#
# - which leaves it runnable by hand from the Actions tab and off everywhere
# else.
#
# The analysers in ci.yml - clang-tidy, cppcheck, ASan + UBSan, and the tooling
# lint - all run entirely inside their own jobs and need no GitHub feature at
# all.  This one is the addition that reads across translation units, not the
# thing the others depend on.

name: CodeQL

on:
  push:
    branches: [main, master]
    tags-ignore: ['**']        # tags are the release workflow's business
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC - off the hour, which is busy

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  analyze:
    name: analyze (c-cpp)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          # security-and-quality is the widest set.  A state machine parser is
          # exactly the kind of code where the quality queries earn their time.
          queries: security-and-quality

      # Manual build mode: CodeQL watches a real compile, so the dependencies
      # have to be built too.  Debug and unoptimised, so the extracted IR maps
      # cleanly back to source.
      - name: Build
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-codeql --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
