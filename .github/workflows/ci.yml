# SPDX-License-Identifier: MIT
#
# The build gate.  Seven jobs, each answering a different question:
#
#   build       does it compile and pass its tests, on three toolchains
#   coverage    how much of it did the tests actually reach
#   install     can anyone else consume it: install, find_package, link, run
#   cross       does the part meant for a target compile for one
#   capacities  do the tests test the code, or the default configuration
#   clang-tidy  what is wrong with code no test happened to run
#   cppcheck    a second opinion from a different engine
#
# Two more gates used to live here and now have workflows of their own, because
# a GitHub status badge is per workflow and not per job, and the README badges
# each gate separately: sanitizers.yml runs ASan and UBSan over the suite, and
# lint.yml reads the tooling and these workflow files.
#
# The two static analysers are invoked through tools/analyze.sh rather than
# spelled out here, so the flags exist once and a local run is the same run.
#
# Coverage is published to codecov.io.  That is the one thing in this
# repository that talks to a service outside GitHub - and it still needs no
# credential: the repository is public, and Codecov accepts a tokenless upload
# from Actions for a public repository, so there is no secret to rotate here
# either.  The upload fails the job when it cannot run rather than passing
# quietly, on the same principle as tools/analyze.sh - a gate that could not
# run has not passed.  Should tokenless uploads ever start being rate limited,
# the fix is a CODECOV_TOKEN secret passed to the step as `token:`.

name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['**']        # tags are the release workflow's business
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete.  Nothing here writes to the
# repository any more - the coverage numbers leave as an upload rather than as
# a commit - so there is no branch state a cancelled run could leave behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One shared location for everything FetchContent pulls, so it can be cached.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            werror: 'ON'
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            werror: 'ON'
          - name: windows-msvc
            os: windows-2022
            werror: 'ON'

    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          # Keyed per matrix entry: _deps holds configured build trees, and one
          # toolchain's are not another's.
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMS_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The configuration is a run-time input, so the only way to know the
      # shipped YAML is still valid is to run the binary over it.
      - name: Validate the shipped configuration
        shell: bash
        run: |
          exe=build/car_console
          [ -x "$exe" ] || exe=build/Release/car_console.exe
          "$exe" examples/car/car.setup.yaml examples/car/car.machine.yaml --check

  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install gcovr
        run: pip install "gcovr==8.*"

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-coverage-

      - name: Configure
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFMS_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Test
        run: |
          find build-coverage -name '*.gcda' -delete
          ctest --test-dir build-coverage --output-on-failure

      - name: Report
        run: |
          mkdir -p build-coverage/report
          # --gcov-object-directory keeps gcov's intermediates inside the build
          # tree instead of scattering .gcov files across the source root.
          gcovr --config gcovr.cfg \
                --root . \
                --gcov-object-directory build-coverage \
                build-coverage \
                --json-summary-pretty -o build-coverage/coverage.json \
                --html-details build-coverage/report/index.html \
                --cobertura build-coverage/cobertura.xml \
                --txt

      # The gate, and it is this repository's own rather than the service's:
      # codecov can be configured to fail a build too, but a floor that lives
      # in the tree is one a reader can find and a fork still gets.  Start at
      # the current number rounded down and raise it as the tests grow; a floor
      # that never moves is not a gate, it is decoration.
      - name: Enforce the coverage floor
        run: |
          python3 tools/coverage_report.py build-coverage/coverage.json \
            --fail-under 90

      # Cobertura rather than the raw gcov data: it is what gcovr already
      # writes for the report above, so nothing is measured twice.  No token -
      # a public repository uploads to Codecov from Actions without one.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build-coverage/cobertura.xml
          # Naming a file is not enough: the action still searches the
          # workspace and would find the raw gcov data next to it, which has
          # not been through gcovr.cfg's filter.  The first upload without this
          # measured 35 files instead of 24 - tests/ and examples/ included -
          # so the badge reported a number this repository deliberately does
          # not measure.
          disable_search: true
          # An upload that silently did not happen would leave the badge
          # showing an old number with a green build underneath it.
          fail_ci_if_error: true

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build-coverage/report
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Everything above builds inside the tree, where a missing install rule, an
  # unexported target or a dependency the package config forgets to ask for
  # cannot show up.  find_package(fms_yaml) is the supported way to consume the
  # library, so it gets a gate of its own: install it, then build something that
  # knows it only through that.
  #
  # This is also the only job that builds with -DFMS_FETCH_DEPS=OFF, which
  # installing requires: a dependency FetchContent built inside the build tree
  # cannot be exported with it.  tools/install_check.sh installs ETL and
  # yaml-cpp at the pinned versions first, so a local run is the same run.
  install:
    name: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Keyed on the script, because the dependency versions live in it.  Only
      # the sources are cached, not the build trees: a stale build tree pointing
      # at a prefix from an earlier run is harder to reason about than a rebuild.
      - name: Cache the dependency sources
        uses: actions/cache@v6
        with:
          path: |
            build-install/etl-src
            build-install/yaml-cpp-src
          key: install-src-${{ hashFiles('tools/install_check.sh') }}

      - name: Install, then build a consumer against the installed package
        run: bash tools/install_check.sh

  # ---------------------------------------------------------------------------
  # Every other job builds for the host, where a stray <iostream> or a call into
  # the hosted runtime compiles without complaint.  docs/architecture.md says
  # fms_core needs only <cstdint>, <cstddef>, <cstring> and ETL, and that a
  # firmware build links it and stops there; this is the job that makes that a
  # compile rather than a claim.
  #
  # Compile only.  There is no startup code, linker script or board here, and
  # none of that belongs to the library.
  cross:
    name: cross (arm-none-eabi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # gcc-arm-none-eabi is the compiler and nothing else on Ubuntu: the C
      # library and the C++ headers are separate packages, and without them
      # every translation unit fails on <cstddef>.
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-cross-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-cross-

      - name: Compile fms_core and fms_inspect for a Cortex-M4
        run: bash tools/cross_check.sh

  # ---------------------------------------------------------------------------
  # Every other job builds at the capacities in include/fms/limits.hpp, which is
  # one instantiation of Model, Setup, Args, Runtime and lint::Report.  A test
  # that writes out four argument pairs, or a 400-character line, or a whole
  # diagnostic sentence, then asserts something about that configuration rather
  # than about the code - and passes for a reason nobody chose.
  #
  # Three configurations, including the tuning docs/architecture.md gives for
  # the car example, so the documentation's own claim is built and tested.
  capacities:
    name: capacities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-capacities-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-capacities-

      - name: Build and test at three capacity configurations
        run: bash tools/capacity_sweep.sh

  # ---------------------------------------------------------------------------
  # Every other job builds against the pinned ETL.  A consumer supplying its own
  # takes the find_package(etl REQUIRED) branch and may bring any version, so
  # this is the job that says what happens on the ones this project does not
  # pin.  The two below the 20.40.1 tag are in the matrix deliberately: that is
  # where sizeof(etl::vector) lost 8 bytes with no interface change, and a
  # matrix covering only one side of it would stop measuring the boundary.
  #
  # 20.48.1 is another project's pin rather than a version of interest here.
  # Two libraries that both FetchContent ETL into one binary get whichever
  # declared it first, so a composed build can compile this one against a pin it
  # does not choose - which is a version to have run the suite on.
  #
  # Sizes are recorded, not asserted.  docs/stability.md promises no binary
  # compatibility in either direction, so a layout that moves is news rather
  # than a failure - but it is never silent.
  # The matrix above is a third place the ETL version lives, after the
  # FetchContent pin and tools/install_check.sh.  Nothing makes them agree, so
  # this asserts the one that would otherwise drift quietly: a matrix that has
  # stopped listing the pin tests a range the project does not itself build at.
  etl-pin:
    name: etl (matrix lists the pin)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The matrix lists the pinned ETL
        run: bash tools/etl_range_check.sh --check

  etl-range:
    name: etl (${{ matrix.etl }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        etl: ['20.39.0', '20.39.4', '20.40.0', '20.40.1',
              '20.41.0', '20.43.0', '20.44.0', '20.46.0', '20.48.1']
    steps:
      - uses: actions/checkout@v7

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-etl-range-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-etl-range-

      - name: Build and test against ETL ${{ matrix.etl }}
        run: bash tools/etl_range_check.sh '${{ matrix.etl }}'

  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # clang-tools-18 is what provides run-clang-tidy-18; the clang-tidy-18
      # package alone gives only the single-file driver.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-tools-18
          clang-tidy-18 --version

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-tidy-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-tidy-

      # The script configures a compile database (clang-tidy needs the exact
      # compile line for every file), builds yaml-cpp for its generated headers
      # and nothing else, and runs the analyser over src, tests and examples.
      # It pipes into tee, which is why it is a script: a workflow `run:` block
      # gets `bash -e`, without pipefail, so the step would report tee's exit
      # code - always zero - and the gate would never fail.
      - name: Run clang-tidy
        env:
          BUILD_DIR: ${{ github.workspace }}/build-tidy
          RUN_CLANG_TIDY: run-clang-tidy-18
          CLANG_TIDY_BINARY: clang-tidy-18
          CXX: clang++-18
        run: bash tools/analyze.sh clang-tidy

      - name: Upload the clang-tidy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      # error and warning fail the job; style, performance and portability are
      # reported and do not.  Everything lands in the job summary either way -
      # the script appends to it when GITHUB_STEP_SUMMARY is set.
      - name: Run cppcheck
        run: bash tools/analyze.sh cppcheck

      - name: Upload the cppcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-xml
          path: cppcheck.xml
          retention-days: 30
