# SPDX-License-Identifier: MIT
#
# The quality gate.  Six jobs, each answering a different question:
#
#   build       does it compile and pass its tests, on three toolchains
#   coverage    how much of it did the tests actually reach
#   clang-tidy  what is wrong with code no test happened to run
#   cppcheck    a second opinion from a different engine
#   lint        is the tooling that runs the gates itself sound
#   sanitizers  was the code that did run reading memory it owns
#
# The two static analysers are invoked through tools/analyze.sh rather than
# spelled out here, so the flags exist once and a local run is the same run.
#
# Nothing here talks to a service outside GitHub.  The repository is private,
# so the coverage badge is an SVG committed to docs/badges/ rather than a call
# to shields.io or codecov.io, and the only credential in use is the
# automatically provided GITHUB_TOKEN.

name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['**']        # tags are the release workflow's business
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete - except on the default branch,
# where the coverage job commits and a cancelled run would leave the badge
# behind the code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}

permissions:
  contents: read

env:
  # One shared location for everything FetchContent pulls, so it can be cached.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            werror: 'ON'
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            werror: 'ON'
          - name: windows-msvc
            os: windows-2022
            werror: 'OFF'   # /W4 /WX is unproven here; turn it on once it is green

    steps:
      - uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          # Keyed per matrix entry: _deps holds configured build trees, and one
          # toolchain's are not another's.
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMS_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The configuration is a run-time input, so the only way to know the
      # shipped YAML is still valid is to run the binary over it.
      - name: Validate the shipped configuration
        shell: bash
        run: |
          exe=build/car_console
          [ -x "$exe" ] || exe=build/Release/car_console.exe
          "$exe" examples/car/car.setup.yaml examples/car/car.machine.yaml --check

  # ---------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used on the default branch, to commit the badge
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gcovr
        run: pip install "gcovr==8.*"

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-coverage-

      - name: Configure
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFMS_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Test
        run: |
          find build-coverage -name '*.gcda' -delete
          ctest --test-dir build-coverage --output-on-failure

      - name: Report
        run: |
          mkdir -p build-coverage/report
          # --gcov-object-directory keeps gcov's intermediates inside the build
          # tree instead of scattering .gcov files across the source root.
          gcovr --config gcovr.cfg \
                --root . \
                --gcov-object-directory build-coverage \
                build-coverage \
                --json-summary-pretty -o build-coverage/coverage.json \
                --html-details build-coverage/report/index.html \
                --cobertura build-coverage/cobertura.xml \
                --txt

      # --fail-under is the actual gate.  Start at the current number rounded
      # down and raise it as the tests grow; a floor that never moves is not a
      # gate, it is decoration.
      - name: Write the badge and the README table
        run: |
          python3 tools/coverage_report.py build-coverage/coverage.json \
            --readme README.md \
            --badge docs/badges/coverage.svg \
            --fail-under 80

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build-coverage/report
          retention-days: 30

      # Only on the default branch: a pull request from a fork has no write
      # token, and a PR branch is not what the README should describe anyway.
      # The branch can move while the tests are running, in which case the push
      # is rejected.  Rather than rebase a commit whose entire content is
      # generated - a conflict in numbers nobody wrote - reset to the new tip
      # and re-run the splice, which rewrites only the marked block and leaves
      # any prose that landed in the meantime alone.  build-coverage/ is
      # gitignored, so the measurement survives the reset.
      - name: Commit the badge if it moved
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add README.md docs/badges/coverage.svg
            if git diff --cached --quiet; then
              echo "coverage unchanged; nothing to commit"
              exit 0
            fi
            # [skip ci] so this commit does not start the workflow that made it.
            git commit -m "ci: update coverage badge [skip ci]"

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            echo "::notice::${BRANCH} moved during the coverage run"\
                 "(attempt ${attempt}/3); replaying onto the new tip."
            git reset --hard "HEAD~1"
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            python3 tools/coverage_report.py build-coverage/coverage.json \
              --readme README.md \
              --badge docs/badges/coverage.svg
          done

          echo "::warning::Could not push the coverage badge after 3 attempts."\
               "The next push to ${BRANCH} will refresh it."

  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # clang-tools-18 is what provides run-clang-tidy-18; the clang-tidy-18
      # package alone gives only the single-file driver.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-tools-18
          clang-tidy-18 --version

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-tidy-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-tidy-

      # The script configures a compile database (clang-tidy needs the exact
      # compile line for every file), builds yaml-cpp for its generated headers
      # and nothing else, and runs the analyser over src, tests and examples.
      # It pipes into tee, which is why it is a script: a workflow `run:` block
      # gets `bash -e`, without pipefail, so the step would report tee's exit
      # code - always zero - and the gate would never fail.
      - name: Run clang-tidy
        env:
          BUILD_DIR: ${{ github.workspace }}/build-tidy
          RUN_CLANG_TIDY: run-clang-tidy-18
          CLANG_TIDY_BINARY: clang-tidy-18
          CXX: clang++-18
        run: bash tools/analyze.sh clang-tidy

      - name: Upload the clang-tidy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      # error and warning fail the job; style, performance and portability are
      # reported and do not.  Everything lands in the job summary either way -
      # the script appends to it when GITHUB_STEP_SUMMARY is set.
      - name: Run cppcheck
        run: bash tools/analyze.sh cppcheck

      - name: Upload the cppcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-xml
          path: cppcheck.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The gates are only as good as the code that runs them: a workflow with a
  # typo'd expression, a script that silently swallows an exit code.  Nothing
  # read tools/ or .github/ until this job existed.  No formatter here - see
  # ruff.toml for why.
  lint:
    name: lint (tooling)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Pinned like gcovr is: ruff is pre-1.0 and adds rules in minor
      # releases, and a linter that updates itself turns the tree red on
      # someone else's schedule.
      - name: Install ruff
        run: pip install "ruff==0.15.*"

      # Pinned for the same reason as ruff and actionlint.  The runner image
      # ships a shellcheck of its own, so the version check is not decoration:
      # it proves the pinned binary is the one earlier on PATH, rather than the
      # job quietly linting with whatever the image happened to bring.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: '0.10.0'
        run: |
          set -o pipefail
          curl -sSfL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 \
                "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -o pipefail
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Lint the tooling
        run: bash tools/analyze.sh lint

  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: deps-asan-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-asan-

      - name: Configure
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFMS_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan --parallel

      # halt_on_error keeps the first report from being buried under the rest,
      # and detect_leaks matters here specifically: alloc_guard replaces global
      # operator new, so a mistake in it would leak silently.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
