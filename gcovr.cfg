# gcovr configuration.  Used by `tools/coverage.sh` and by the CI coverage job,
# so a local report and the one in the README are produced the same way.
#
# What is measured: src/ and include/fms/ - the code this repository is
# responsible for.  What is not: the tests themselves (a test that never ran is
# a failing test, not a coverage gap), the example application, and everything
# FetchContent unpacked under _deps/.

filter = src/
filter = include/fms/

exclude = .*/tests/.*
exclude = .*/examples/.*
exclude = .*/_deps/.*

# Branches that only exist because the compiler emitted them - exception
# unwinding edges and provably dead arms - are not decisions anyone can test.
exclude-unreachable-branches = yes
exclude-throw-branches = yes

# Every source file, including the ones no test touched at all.  A file with
# zero coverage silently missing from the report is the failure mode worth
# guarding against.
gcov-ignore-parse-errors = negative_hits.warn
sort = uncovered-percent
