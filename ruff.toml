# SPDX-License-Identifier: MIT
#
# ruff over tools/.  Those scripts are not shipped with the library, but they
# are the code that decides whether the other gates pass, and until this file
# existed nothing read them at all.
#
# No formatter runs in CI.  `ruff format` would undo alignment that is there on
# purpose - the columns in a report the scripts print, and the comment columns
# in analyze.sh's neighbours - the same reason .clang-tidy sets
# FormatStyle: none.

line-length = 100

# 3.10 is the real floor, not a preference: wiki_sync.py and diagram_sync.py
# both call Path.write_text(newline="\n"), and that parameter did not exist
# before 3.10.  Telling ruff py39 would have had the pyupgrade rules hold the
# scripts back from syntax they are already entitled to use.
target-version = "py310"

[lint]
# Correctness first, then the rules that catch a script quietly doing the wrong
# thing: B (bugbear) for the mutable-default and loop-variable traps, ARG for a
# parameter nobody passes any more, PTH for os.path calls in a file that has
# already decided on pathlib.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "PTH"]
